<div
    class="decorated-container"
    data-hyui-title="Player Detector"
    style="anchor-height: 200; anchor-width: 500"
>
    <div
        class="row"
        style="
            layout-mode: Left;
            anchor-top: 5;
            anchor-bottom: 5;
            flex-weight: 1;
        "
    >
        <label style="vertical-align: Center; anchor-vertical: 5"
            >Range:
        </label>
        <input
            id="range"
            type="number"
            step="0.1"
            data-hyui-max-decimal-places="2"
            style="
                anchor-vertical: 5;
                flex-weight: 1;
                anchor-horizontal: 10;
                anchor-min-width: 50;
            "
        />
    </div>
    <div
        class="row"
        style="
            layout-mode: Left;
            anchor-top: 5;
            anchor-bottom: 5;
            flex-weight: 1;
        "
    >
        <label style="vertical-align: Center; anchor-vertical: 5">Mode: </label>
        <select
            id="mode"
            style="
                anchor-vertical: 5;
                flex-weight: 1;
                anchor-horizontal: 10;
                anchor-min-width: 50;
            "
        ></select>
    </div>
</div>

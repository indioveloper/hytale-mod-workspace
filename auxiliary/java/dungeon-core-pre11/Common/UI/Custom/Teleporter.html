<div
    class="decorated-container"
    data-hyui-title="Teleporter Block"
    style="anchor-height: 240; anchor-width: 500"
>
    <div
        class="row"
        style="
            layout-mode: Left;
            anchor-top: 5;
            anchor-bottom: 5;
            flex-weight: 1;
        "
    >
        <label style="vertical-align: Center; anchor-vertical: 5">Mode: </label>
        <select
            id="mode"
            style="
                anchor-vertical: 5;
                flex-weight: 1;
                anchor-horizontal: 10;
                anchor-min-width: 50;
            "
        >
        </select>
        <label style="vertical-align: Center; anchor-vertical: 5">Relative: </label>
        <input
                id="relative"
                style="
                anchor-vertical: 5;
                flex-weight: 1;
                anchor-horizontal: 10;
                anchor-min-width: 50;
            "
                type="checkbox"
        >
    </div>
    <div
            class="row"
            style="
            layout-mode: Left;
            anchor-top: 5;
            anchor-bottom: 5;
            flex-weight: 1;
        "
            id="additional"
    >
        <label style="vertical-align: Center; anchor-vertical: 5">Recv settings: </label>
        <select id="recv-settings" style="anchor-vertical: 5; flex-weight: 1; anchor-horizontal: 10;  anchor-min-width: 50;">
        </select>
    </div>
    <div
            class="row"
            style="
            layout-mode: Left;
            anchor-top: 5;
            anchor-bottom: 5;
            flex-weight: 1;
        "
    >

        <label style="vertical-align: Center; anchor-vertical: 5">Send settings: </label>
        <select id="send-settings" style="anchor-vertical: 5; flex-weight: 1; anchor-horizontal: 10;  anchor-min-width: 50;">
        </select>
    </div>
</div>

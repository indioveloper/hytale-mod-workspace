<div
    class="decorated-container"
    data-hyui-title="Mob Spawner"
    style="anchor-height: 400; anchor-width: 1600"
>
    <div class="row" style="layout-mode: Top; anchor-height: 80">
        <div class="row-header" style="layout-mode: Left; anchor-height: 40">
            <label
                style="vertical-align: Center; anchor-left: 10; flex-weight: 10"
                >Name</label
            >

            <label
                style="vertical-align: Center; anchor-left: 10; flex-weight: 1"
                >Count</label
            >

            <label
                style="vertical-align: Center; anchor-left: 10; flex-weight: 1"
                >Range</label
            >
        </div>

        <div class="row-content" style="layout-mode: Left; anchor-height: 40">
            <input
                type="text"
                id="role"
                placeholder="Name of Role"
                maxlength="30"
                style="
                    flex-weight: 5;
                    anchor-left: 10;
                    anchor-right: 0;
                    anchor-min-width: 50;
                "
            />
            <div
                style="
                    flex-weight: 1;
                    layout-mode: Left;
                    anchor-left: 10;
                    anchor-right: 10;
                    anchor-min-width: 100;
                "
            >
                <input
                    id="count"
                    type="number"
                    value="1"
                    data-hyui-max-decimal-places="0"
                    style="flex-weight: 1; anchor-left: 0; anchor-min-width: 50"
                />
                <input
                    id="range"
                    type="number"
                    value="1"
                    data-hyui-max-decimal-places="2"
                    style="
                        flex-weight: 1;
                        anchor-left: 10;
                        anchor-min-width: 50;
                    "
                />
            </div>
        </div>
    </div>

    <div
        class="row"
        style="
            layout-mode: Left;
            anchor-height: 80;
            anchor-top: 10;
            padding: 20;
        "
    >
        <label style="vertical-align: Center; padding: 10"
            >Health Modifier:
        </label>
        <input
            id="health"
            type="number"
            value="100"
            min="1"
            max="1000"
            data-hyui-max-decimal-places="0"
            style="
                flex-weight: 1;
                anchor-left: 10;
                anchor-right: 10;
                anchor-min-width: 50;
            "
        />
    </div>
